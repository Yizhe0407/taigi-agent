name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      # NLTK PYSEC-2026-597 has no fixed release. The application never passes
      # user-controlled resource paths to nltk.data.load/find.
      - name: Dependency audit
        run: uv run pip-audit --local --ignore-vuln PYSEC-2026-597

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  deployment:
    name: Deployment files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find deploy -type f -name '*.sh' -print0)

      - name: Test deployment helpers
        run: bash deploy/tests/test_lib.sh

      - name: Render service templates
        shell: bash
        run: |
          export APP_USER=taigi
          export APP_GROUP=taigi
          export DEPLOY_ROOT=/opt/taigi-agent
          export ENV_FILE=/etc/taigi-agent/taigi-agent.env
          export BACKEND_PORT=8080
          export WEB_PORT=3000
          source deploy/lib.sh
          unit_file="$(mktemp)"
          nginx_file="$(mktemp)"
          trap 'rm -f "$unit_file" "$nginx_file"' EXIT
          render_template deploy/systemd/taigi-agent.service.in "$unit_file"
          render_template deploy/nginx/taigi-agent.conf.in "$nginx_file"
          ! grep -q '@@' "$unit_file" "$nginx_file"
          grep -q -- '--workers 1' "$unit_file"
          grep -q 'listen 127.0.0.1:3000' "$nginx_file"
          grep -q 'proxy_buffering off' "$nginx_file"
